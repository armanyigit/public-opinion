# Local Postgres with pgvector for public-opinion.
# Matches DATABASE_URL in .env.example.
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: public-opinion-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: public_opinion
    ports:
      - "5432:5432"
    volumes:
      - public_opinion_pgdata:/var/lib/postgresql/data
      # Runs once on first volume init (CREATE EXTENSION vector)
      - ./drizzle/0000_enable_pgvector.sql:/docker-entrypoint-initdb.d/0000_enable_pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d public_opinion"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  public_opinion_pgdata:
